[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speqr"
version = "0.1.0"
description = "How you declare what your code should do"
readme = "README.md"
license = "MIT"
authors = [{name = "Steven Devisch"}]
requires-python = ">=3.12"
dependencies = [
    "lark>=1.2.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.15.1"]

[project.scripts]
speqr = "speqr.cli:app"

[project.urls]
Repository = "https://github.com/Orxaq/speqr"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
