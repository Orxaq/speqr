[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speqr"
version = "0.0.1"
description = "How you declare what your code should do"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.2.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]

[project.scripts]
speqr = "speqr.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
